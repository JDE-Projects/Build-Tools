name: CI (reusable)

# Every Simple X Tool calls this on pull requests and pushes to main. It runs
# the same sanity checks the release workflows run (ruff lint, an import of
# entry_script, pytest on tests/), so a bad dependency bump or a broken import
# fails on the PR instead of surfacing mid-release. There is no packing,
# signing, or publishing here: this workflow never writes anything.

on:
  workflow_call:
    inputs:
      python_version:      { type: string, default: '3.11' }  # match the deployment target (Raspberry Pi OS Bookworm ships 3.11)
      entry_script:        { type: string, default: '' }      # app's main .py (e.g. main.py); enables the import check when set
      verify_dev_pins:     { type: boolean, default: false }  # require requirements-dev.txt to match _buildtools/templates/dev/requirements.txt
      verify_runtime_lock: { type: boolean, default: false }  # require requirements.txt to match requirements.in (uv-compiled, committed versions kept, hashes re-fetched), and install it with --require-hashes
      shellcheck:          { type: boolean, default: false }  # lint shellcheck_paths with a pinned ShellCheck
      shellcheck_paths:    { type: string, default: 'install.sh uninstall.sh' }  # space-separated, caller-owned files only

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '${{ inputs.python_version }}' }
      - name: Get Build-Tools templates
        # Version-matches the dev tooling pins (ruff, pytest) to this workflow's
        # exact version. Use job.workflow_sha (github.job_workflow_sha is not a
        # real context and silently resolves to empty).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _buildtools
      - name: Verify dev tooling pins
        if: ${{ inputs.verify_dev_pins }}
        run: bash _buildtools/scripts/checks/verify_dev_pins.sh
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.verify_runtime_lock }}" = "true" ]; then
            python -m pip install --require-hashes -r requirements.txt
          else
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          fi
          pip install -r _buildtools/templates/dev/requirements.txt
      - name: Verify runtime lock
        if: ${{ inputs.verify_runtime_lock }}
        run: bash _buildtools/scripts/checks/verify_runtime_lock.sh
      - name: Lint (ruff)
        run: |
          # --exclude _buildtools: that folder is this workflow's own checkout,
          # not the caller's code. Linting it would fail a tool's PR for a
          # problem in Build-Tools.
          ruff check . --select E4,E7,E9,F,B --exclude _buildtools
      - name: Import check
        if: ${{ inputs.entry_script != '' }}
        run: python -c "import $(basename '${{ inputs.entry_script }}' .py)"
      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "No tests folder; skipping pytest."
          fi
      - name: ShellCheck
        if: ${{ inputs.shellcheck }}
        run: bash _buildtools/scripts/checks/run_shellcheck.sh "${{ inputs.shellcheck_paths }}"
